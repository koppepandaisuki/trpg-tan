[package]
name = "trpg-desktop"
version = "0.0.0"
description = "TRPG Desktop"
authors = ["Re-dice"]
edition = "2021"

# Tauri v2。フロントは Vite(../dist)。ライブラリ + バイナリの二段構成
# (モバイル対応や統合テストのため Tauri v2 標準のレイアウト)。
[lib]
name = "trpg_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-fs = "2"
tauri-plugin-dialog = "2"
tauri-plugin-deep-link = "2"
tauri-plugin-opener = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-http = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
